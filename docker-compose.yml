version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aruba-backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - MOCK_MODE=true
      - LOG_LEVEL=INFO
    volumes:
      - audit-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - aruba-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aruba-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aruba-net

  hermes:
    build:
      context: ./hermes
      dockerfile: Dockerfile
    container_name: aruba-hermes
    ports:
      - "8080:8080"
    volumes:
      - ./hermes/agent_config.yaml:/app/agent_config.yaml:ro
      - ./hermes/prompts:/app/prompts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - aruba-net

volumes:
  audit-data:

networks:
  aruba-net:
    driver: bridge
